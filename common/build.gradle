architectury {
    common(['fabric', 'neoforge'])
}

loom {
    accessWidenerPath = file('src/main/resources/lightstones.accesswidener')
}

dependencies {
    // Compile-time only for Mixin annotations; no Fabric API runtime dependency in common.
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Compile-time only for optional ClothConfigScreenFactory.
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
}
